[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klaus-assistant"
version = "0.3.3"
description = "Voice-powered research assistant for physical and digital media."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Billy Gigurtsis" },
]
keywords = ["accessibility", "macos", "screen-reading", "research", "voice-assistant"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openai>=1.58.0",
    "websocket-client>=1.8.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "sounddevice>=0.5.0",
    "pynput>=1.7.6",
    "PyQt6>=6.11.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.4.0",
    "keyring>=25.6.0",
    "pyobjc-framework-AVFoundation>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "webrtcvad-wheels>=2.0.14",
    "moonshine-voice>=0.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
klaus = "klaus.main:main"

[project.urls]
Homepage = "https://github.com/bgigurtsis/Klaus"
Repository = "https://github.com/bgigurtsis/Klaus"
Issues = "https://github.com/bgigurtsis/Klaus/issues"

[tool.hatch.build]
exclude = [
    "klaus/ui/icon-concepts/",
]

[tool.hatch.build.targets.wheel]
packages = ["klaus"]
